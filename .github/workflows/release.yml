name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, so released versions aren't tagged again
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Opens the "Version Packages" PR, or tags the release once that PR is merged
      - id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npx changeset publish
          create-github-releases: false # the packager creates it, with the zip attached

      # Runs here because tags pushed with GITHUB_TOKEN don't trigger other workflows
      - if: steps.changesets.outputs.published == 'true'
        run: awk '/^## /{n++} n==1' CHANGELOG.md > RELEASE_NOTES.md
      - if: steps.changesets.outputs.published == 'true'
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
