name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # run on a tag to (re)package that release

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, so released versions aren't tagged again
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Opens the "Version Packages" PR, or tags the release once that PR is merged
      - id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npx changeset publish
          create-github-releases: false # the packager creates it, with the zip attached

      # A tag pushed with GITHUB_TOKEN triggers nothing, and the packager skips branch
      # pushes whose commit is tagged, so package in a dispatched run on the tag instead
      - if: steps.changesets.outputs.published == 'true'
        run: gh workflow run release.yml --ref "v$(jq -r .version package.json)"
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: awk '/^## /{n++} n==1' CHANGELOG.md > RELEASE_NOTES.md
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
